apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas
  namespace: atlas
data:
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  EMBEDDED_WORKER: "false"
  SAMPLES_DIR: /app/samples
  CHAT_MODEL: gpt-4o
  CHEAP_MODEL: gpt-4o-mini
  EMBEDDING_MODEL: text-embedding-3-small
---
# Redis / Qdrant in-cluster are for demos. Production on GCP: Memorystore + a
# dedicated Qdrant StatefulSet (or Vertex Vector Search if you accept the lock-in).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: atlas
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: atlas-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: atlas } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: atlas
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: atlas-api:latest
          command: ["python", "-m", "app.worker"]
          envFrom: [{ configMapRef: { name: atlas } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: atlas
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
