apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: atlas
data:
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  EMBEDDED_WORKER: "false"
  SAMPLES_DIR: /app/samples
  UPLOAD_DIR: /app/data/uploads
  ENABLE_CROSS_ENCODER: "false"
  # Calibrated in scripts/loadtest.py; see app/config.py for why 300.
  RATE_LIMIT_PER_MINUTE: "300"
  CHAT_MODEL: gpt-4o
  CHEAP_MODEL: gpt-4o-mini
  EMBEDDING_MODEL: text-embedding-3-small
# Create the LLM secret separately (do not put a real key in this file):
#   kubectl create secret generic atlas-llm --from-literal=OPENAI_API_KEY=... -n atlas
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: atlas
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlas
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so two pods cannot
  # hold it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis holds the document catalogue, not just cache. Without AOF a
          # restart leaves Qdrant full of vectors that no catalogue entry
          # points at, and the UI reports an empty corpus.
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlas
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: atlas
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.5
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi, cpu: "1" }
          ports: [{ containerPort: 6333 }]
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: atlas
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          # scripts/k8s-deploy.ps1 rewrites this tag to the image it just built.
          image: atlas-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: atlas-config } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
            - name: ATLAS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: atlas-auth
                  key: ATLAS_API_KEYS
                  optional: true
          # Headroom for the cross-encoder (PyTorch) when it is enabled. The
          # limit matters more than the request: without one, a model load can
          # take the whole node down instead of just this pod.
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 2Gi, cpu: "2" }
          volumeMounts:
            - name: samples
              mountPath: /app/samples/corpus
              readOnly: true
            - name: eval
              mountPath: /app/samples/eval
              readOnly: true
            - name: uploads
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: samples
          configMap:
            name: atlas-corpus
        - name: eval
          configMap:
            name: atlas-eval
        - name: uploads
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
      # The worker serves no HTTP of its own, so it runs a listener purely to
      # be scrapeable. Without it, index throughput and failures are invisible.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: worker
          image: atlas-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom: [{ configMapRef: { name: atlas-config } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
            - name: WORKER_ID
              value: atlas-worker
            - name: ATLAS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: atlas-auth
                  key: ATLAS_API_KEYS
                  optional: true
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 2Gi, cpu: "2" }
          volumeMounts:
            - name: samples
              mountPath: /app/samples/corpus
              readOnly: true
      volumes:
        - name: samples
          configMap:
            name: atlas-corpus
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: atlas
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: atlas-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ATLAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-auth
                  key: ATLAS_FRONTEND_KEY
                  optional: true
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi, cpu: 500m }
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: atlas
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: atlas.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8000 }
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
