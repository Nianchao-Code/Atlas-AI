apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: atlas
data:
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  EMBEDDED_WORKER: "false"
  SAMPLES_DIR: /app/samples
  UPLOAD_DIR: /app/data/uploads
  ENABLE_CROSS_ENCODER: "true"
  CHAT_MODEL: gpt-4o
  CHEAP_MODEL: gpt-4o-mini
  EMBEDDING_MODEL: text-embedding-3-small
---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-llm
  namespace: atlas
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-data
  namespace: atlas
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlas
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: atlas
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.5
          ports: [{ containerPort: 6333 }]
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: atlas
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: atlas-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: atlas-config } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
          volumeMounts:
            - name: samples
              mountPath: /app/samples/corpus
              readOnly: true
            - name: uploads
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: samples
          configMap:
            name: atlas-corpus
        - name: uploads
          persistentVolumeClaim:
            claimName: upload-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: atlas-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom: [{ configMapRef: { name: atlas-config } }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: atlas-llm, key: OPENAI_API_KEY } }
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - name: samples
              mountPath: /app/samples/corpus
              readOnly: true
            - name: uploads
              mountPath: /app/data
      volumes:
        - name: samples
          configMap:
            name: atlas-corpus
        - name: uploads
          persistentVolumeClaim:
            claimName: upload-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: atlas
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: atlas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: atlas
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: atlas.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8000 }
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
