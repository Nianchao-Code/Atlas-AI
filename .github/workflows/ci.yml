name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports: ["6333:6333"]
    env:
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      ENABLE_CROSS_ENCODER: "false"
      SAMPLES_DIR: ../samples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      # From the repo root: scripts/ imports from backend/app, and linting one
      # without the other leaves the seam between them unchecked.
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Pytest
        working-directory: backend
        run: pytest -q
      - name: Eval smoke gate
        run: python scripts/eval_gate.py --smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run build

  eval-full:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports: ["6333:6333"]
    env:
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      SAMPLES_DIR: ../samples
      ENABLE_CROSS_ENCODER: "false"
      # Job level, not step level: a step's own env is not in scope for that
      # step's `if`, which is why this gate silently skipped every run while
      # the job reported success.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Announce whether the gate can run
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not set; the full eval gate is skipped."
          else
            echo "OPENAI_API_KEY present; running the full gate."
          fi
      - name: Full eval gate
        if: env.OPENAI_API_KEY != ''
        run: python scripts/eval_gate.py --full
