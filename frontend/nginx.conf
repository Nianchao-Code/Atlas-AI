server {
  listen 80;
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
  }
  location /health {
    proxy_pass http://api:8000/health;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
