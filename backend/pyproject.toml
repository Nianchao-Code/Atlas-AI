[project]
name = "atlas-ai"
version = "0.1.0"
description = "Production RAG platform: hybrid retrieval, corrective graph, eval harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.55.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "qdrant-client>=1.12.0,<1.13.0",
  "redis>=5.2.0",
  "tiktoken>=0.8.0",
  "prometheus-client>=0.21.0",
  "python-multipart>=0.0.17",
  "pypdf>=5.1.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.12.0"]
# The cross-encoder drags in torch, triton and 2.7GB of CUDA wheels for a
# reranker the ablation measured at zero benefit on this corpus -- about 4.9GB
# of a CPU-only image. Opt in when a corpus exists where it earns that, and
# install the CPU torch build:
#   pip install -e ".[rerank]" --extra-index-url https://download.pytorch.org/whl/cpu
rerank = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "ruff>=0.8.0", "mypy>=1.13.0"]
# scripts/capture_demo.py only; not needed to run or test the service.
demo = ["playwright>=1.48.0", "pillow>=11.0.0"]

[tool.mypy]
# No python_version pin: it would check 3.11 semantics against whatever stubs
# the running interpreter installed, and numpy's 3.12-era stubs then fail to
# parse. mypy follows the interpreter it runs under, which is what CI and the
# container each want.
# Third-party stubs are not all published; the value here is catching
# contradictions in this code, not annotating other people's.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
